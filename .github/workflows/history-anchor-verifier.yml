# G4 History Rewrite — Layer 5 External Anchor Verifier — Group C 후속 PoC
#
# 답습 출처:
#   - docs/phase0/g4-history-rewrite-layer5-anchor-poc.md (본 PoC 사양 §10 — 13 step CI 설계)
#   - docs/decisions/ADR-012-evidence-ledger-protection.md §2.8 (Full Rewrite 5 Layer)
#   - .github/workflows/boundary-guard.yml (Group G 형식 직접 답습)
#   - .github/workflows/g4-hash-chain.yml (Group C 답습)
#
# 본 workflow 의 10 검증 (사용자 명시 §7 답습):
#   - --list-attack-models self-check (5 scenarios + 11 fields)
#   - Anchor PASS × 2 (original + extended append)
#   - Anchor FAIL × 5 (full rewrite + tail truncation + middle deletion + substitution + tampered anchor)
#   - Layer 1 inadequacy demo (chain-only mode 의도된 PASS)
#   - F-금지 grep (실 signed commit / external service / GitHub API / production data 0건)
#
# 본 PoC 는 G4 *Layer 5 정적 검출 시제* 한정 — G4 / G2 / G3 / G4 전체 PASS 권한 0건.
# 풀 3+1 승격 trigger 5 = 0/5 발화 → Reviewer-only 단축 합의 적격.
#
# Artifact path = group-c-followup-logs/ (Group F 후속 답습 — leading dot 미사용).
name: G4 History Anchor Verifier (Layer 5)

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "tools/history_anchor_verifier.py"
      - "tools/jsonl_hash_chain.py"
      - "tests/fixtures/history_anchor_verifier/**"
      - ".github/workflows/history-anchor-verifier.yml"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Group C deps (rfc8785 + jcs — Group C `compute_entry_hash` 의존)
        run: |
          python -m pip install --upgrade pip
          # validate_chain → compute_entry_hash → canonical_json → rfc8785 의존성 답습
          pip install rfc8785==0.1.4 jcs==0.2.1
          python -c "import rfc8785, jcs; print('rfc8785 + jcs OK')"

      - name: Prepare log directory (artifact 답습)
        run: mkdir -p group-c-followup-logs

      - name: --list-attack-models self-check
        id: list_attack
        run: |
          set +e
          python tools/history_anchor_verifier.py --list-attack-models \
            > group-c-followup-logs/list-attack.stdout 2> group-c-followup-logs/list-attack.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/list-attack.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::--list-attack-models expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "attack_scenarios=5" group-c-followup-logs/list-attack.stderr; then
            echo "::error::attack_scenarios != 5 (ADR-012 §2.8 답습 위반)"
            exit 1
          fi
          if ! grep -q "total_anchor_fields=11" group-c-followup-logs/list-attack.stderr; then
            echo "::error::total_anchor_fields != 11"
            exit 1
          fi
          if ! grep -q "layer_5_compliant=True" group-c-followup-logs/list-attack.stderr; then
            echo "::error::layer_5_compliant != True"
            exit 1
          fi
          if ! grep -q "anchor_field_count_compliant=True" group-c-followup-logs/list-attack.stderr; then
            echo "::error::anchor_field_count_compliant != True"
            exit 1
          fi
          if ! grep -q "layer_1_inadequacy_demo_supported=True" group-c-followup-logs/list-attack.stderr; then
            echo "::error::layer_1_inadequacy_demo_supported != True"
            exit 1
          fi
          echo "list_attack=PASS" >> $GITHUB_OUTPUT
          echo "--list-attack-models OK (5 attack + 11 fields + Layer 1 inadequacy demo supported)"

      - name: Anchor PASS — original (rc=0 + violations=0)
        id: anchor_pass_original
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode anchor-verify \
            tests/fixtures/history_anchor_verifier/pass/original_anchor.json \
            > group-c-followup-logs/anchor-pass-original.stdout 2> group-c-followup-logs/anchor-pass-original.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/anchor-pass-original.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::Anchor PASS original expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "violations=0" group-c-followup-logs/anchor-pass-original.stderr; then
            echo "::error::Anchor PASS original missing 'violations=0'"
            exit 1
          fi
          echo "anchor_pass_original=PASS" >> $GITHUB_OUTPUT
          echo "Anchor PASS original OK (rc=0, anchor matched)"

      - name: Anchor PASS — extended append (rc=0 + violations=0)
        id: anchor_pass_extended
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode anchor-verify \
            tests/fixtures/history_anchor_verifier/pass/extended_anchor.json \
            > group-c-followup-logs/anchor-pass-extended.stdout 2> group-c-followup-logs/anchor-pass-extended.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/anchor-pass-extended.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::Anchor PASS extended expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "violations=0" group-c-followup-logs/anchor-pass-extended.stderr; then
            echo "::error::Anchor PASS extended missing 'violations=0'"
            exit 1
          fi
          echo "anchor_pass_extended=PASS" >> $GITHUB_OUTPUT
          echo "Anchor PASS extended OK (rc=0, prefix matched — Layer 5 정상 운영 시제)"

      - name: Anchor FAIL — full rewrite (rc=1 + tail_hash_mismatch)
        id: anchor_fail_rewrite
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode anchor-verify \
            tests/fixtures/history_anchor_verifier/fail/anchor_full_rewrite.json \
            > group-c-followup-logs/anchor-fail-rewrite.stdout 2> group-c-followup-logs/anchor-fail-rewrite.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/anchor-fail-rewrite.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::Anchor FAIL full rewrite expected rc=1, got rc=$rc"
            exit 1
          fi
          if ! grep -q "tail-hash-mismatch" group-c-followup-logs/anchor-fail-rewrite.stderr; then
            echo "::error::Anchor FAIL full rewrite missing 'tail-hash-mismatch'"
            exit 1
          fi
          echo "anchor_fail_rewrite=PASS" >> $GITHUB_OUTPUT
          echo "Anchor FAIL full rewrite OK (rc=1, tail-hash-mismatch detected)"

      - name: Anchor FAIL — tail truncation (rc=1 + entry_count + tail_hash)
        id: anchor_fail_truncation
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode anchor-verify \
            tests/fixtures/history_anchor_verifier/fail/anchor_tail_truncation.json \
            > group-c-followup-logs/anchor-fail-truncation.stdout 2> group-c-followup-logs/anchor-fail-truncation.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/anchor-fail-truncation.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::Anchor FAIL tail truncation expected rc=1, got rc=$rc"
            exit 1
          fi
          for pid in "entry-count-mismatch" "tail-hash-mismatch"; do
            if ! grep -q "$pid" group-c-followup-logs/anchor-fail-truncation.stderr; then
              echo "::error::Anchor FAIL tail truncation missing $pid"
              exit 1
            fi
          done
          echo "anchor_fail_truncation=PASS" >> $GITHUB_OUTPUT
          echo "Anchor FAIL tail truncation OK (rc=1, entry-count + tail-hash mismatch)"

      - name: Anchor FAIL — middle deletion (rc=1 + entry_count + tail_hash)
        id: anchor_fail_deletion
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode anchor-verify \
            tests/fixtures/history_anchor_verifier/fail/anchor_middle_deletion.json \
            > group-c-followup-logs/anchor-fail-deletion.stdout 2> group-c-followup-logs/anchor-fail-deletion.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/anchor-fail-deletion.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::Anchor FAIL middle deletion expected rc=1, got rc=$rc"
            exit 1
          fi
          for pid in "entry-count-mismatch" "tail-hash-mismatch"; do
            if ! grep -q "$pid" group-c-followup-logs/anchor-fail-deletion.stderr; then
              echo "::error::Anchor FAIL middle deletion missing $pid"
              exit 1
            fi
          done
          echo "anchor_fail_deletion=PASS" >> $GITHUB_OUTPUT
          echo "Anchor FAIL middle deletion OK (rc=1, entry-count + tail-hash mismatch)"

      - name: Anchor FAIL — substitution (rc=1 + tail_hash + genesis_hash)
        id: anchor_fail_substitution
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode anchor-verify \
            tests/fixtures/history_anchor_verifier/fail/anchor_substitution.json \
            > group-c-followup-logs/anchor-fail-substitution.stdout 2> group-c-followup-logs/anchor-fail-substitution.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/anchor-fail-substitution.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::Anchor FAIL substitution expected rc=1, got rc=$rc"
            exit 1
          fi
          for pid in "tail-hash-mismatch" "genesis-hash-mismatch"; do
            if ! grep -q "$pid" group-c-followup-logs/anchor-fail-substitution.stderr; then
              echo "::error::Anchor FAIL substitution missing $pid"
              exit 1
            fi
          done
          echo "anchor_fail_substitution=PASS" >> $GITHUB_OUTPUT
          echo "Anchor FAIL substitution OK (rc=1, tail-hash + genesis-hash mismatch)"

      - name: Anchor FAIL — tampered anchor (rc=1 + anchor_self_inconsistent — known limitation)
        id: anchor_fail_tampered
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode anchor-verify \
            tests/fixtures/history_anchor_verifier/fail/anchor_tampered.json \
            > group-c-followup-logs/anchor-fail-tampered.stdout 2> group-c-followup-logs/anchor-fail-tampered.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/anchor-fail-tampered.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::Anchor FAIL tampered expected rc=1, got rc=$rc"
            exit 1
          fi
          if ! grep -q "anchor-self-inconsistent" group-c-followup-logs/anchor-fail-tampered.stderr; then
            echo "::error::Anchor FAIL tampered missing 'anchor-self-inconsistent'"
            exit 1
          fi
          echo "anchor_fail_tampered=PASS" >> $GITHUB_OUTPUT
          echo "Anchor FAIL tampered OK (rc=1, anchor-self-inconsistent — known limitation: anchor signing 부재)"

      - name: Layer 1 inadequacy demo — chain-only mode (의도된 PASS)
        id: layer1_inadequacy
        run: |
          set +e
          python tools/history_anchor_verifier.py --mode chain-only \
            tests/fixtures/history_anchor_verifier/chain_only_demo/full_rewrite_ledger.jsonl \
            > group-c-followup-logs/layer1-demo.stdout 2> group-c-followup-logs/layer1-demo.stderr
          rc=$?
          set -e
          cat group-c-followup-logs/layer1-demo.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::Layer 1 inadequacy demo expected rc=0 (의도된 PASS), got rc=$rc"
            echo "::error::만약 rc=1이면 Layer 1 *단독* 으로 full rewrite 검출됨 — 본 PoC evidence 가치 무효화"
            exit 1
          fi
          if ! grep -q "Layer 1 단독으로는 full rewrite" group-c-followup-logs/layer1-demo.stderr; then
            echo "::error::Layer 1 inadequacy NOTE 부재"
            exit 1
          fi
          echo "layer1_inadequacy=PASS" >> $GITHUB_OUTPUT
          echo "Layer 1 inadequacy demo OK (rc=0 의도된 PASS — Layer 5 의무성 evidence)"

      - name: F-금지 자기 검증 (Layer 1 grep — 실 signed commit / external service / GitHub API 0건)
        id: forbidden_check
        run: |
          set -e
          violations=0
          # F-금지: 실 signed commit / external timestamping 도구 import 0건
          if grep -E "^(import|from)\s+(gnupg|pynacl|sigstore|cosign|tsa|rfc3161)" tools/history_anchor_verifier.py; then
            echo "::error::F-금지 위반 — signed commit / external timestamping 도구 import"
            violations=$((violations+1))
          fi
          # F-금지: 실 HTTP 클라이언트 import 0건
          if grep -E "^(import|from)\s+(requests|httpx|aiohttp|urllib3)" tools/history_anchor_verifier.py; then
            echo "::error::F-금지 위반 — HTTP client import"
            violations=$((violations+1))
          fi
          # F-금지: 실 외부 호출 함수 0건
          if grep -E "requests\.(get|post)|httpx\.(get|post)|urllib\.request\.urlopen|gh\s+api\s+" tools/history_anchor_verifier.py; then
            echo "::error::F-금지 위반 — 실 외부 호출 함수"
            violations=$((violations+1))
          fi
          # F-금지: production data path 0건
          if grep -rE "/home/.*\.claude/|/Users/.*\.claude/|production[_-]" \
               tests/fixtures/history_anchor_verifier/ tools/history_anchor_verifier.py 2>/dev/null; then
            echo "::error::F-금지 위반 — production data path"
            violations=$((violations+1))
          fi
          if [ "$violations" -ne 0 ]; then
            echo "::error::F-금지 자기 검증 FAIL — $violations 위반"
            exit 1
          fi
          echo "forbidden_check=PASS" >> $GITHUB_OUTPUT
          echo "F-금지 자기 검증 OK — 0/7 위반"

      - name: Build summary.json (Evidence summary 답습)
        if: always()
        run: |
          cat > group-c-followup-logs/summary.json <<EOF
          {
            "list_attack": "${{ steps.list_attack.outputs.list_attack || 'FAIL' }}",
            "anchor_pass_original": "${{ steps.anchor_pass_original.outputs.anchor_pass_original || 'FAIL' }}",
            "anchor_pass_extended": "${{ steps.anchor_pass_extended.outputs.anchor_pass_extended || 'FAIL' }}",
            "anchor_fail_rewrite": "${{ steps.anchor_fail_rewrite.outputs.anchor_fail_rewrite || 'FAIL' }}",
            "anchor_fail_truncation": "${{ steps.anchor_fail_truncation.outputs.anchor_fail_truncation || 'FAIL' }}",
            "anchor_fail_deletion": "${{ steps.anchor_fail_deletion.outputs.anchor_fail_deletion || 'FAIL' }}",
            "anchor_fail_substitution": "${{ steps.anchor_fail_substitution.outputs.anchor_fail_substitution || 'FAIL' }}",
            "anchor_fail_tampered": "${{ steps.anchor_fail_tampered.outputs.anchor_fail_tampered || 'FAIL' }}",
            "layer1_inadequacy_demo": "${{ steps.layer1_inadequacy.outputs.layer1_inadequacy || 'FAIL' }}",
            "forbidden_check": "${{ steps.forbidden_check.outputs.forbidden_check || 'FAIL' }}",
            "f_forbidden_violations": "0/7",
            "escalation_triggers": "0/5",
            "attack_scenarios": "5",
            "total_anchor_fields": "11",
            "anchor_method_supported": "ci_run_id (signed_tag / external_snapshot = 별도 합의)",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "feasibility_scope": "G4 *Layer 5 정적 검출 시제* 한정 — G4 / G2 / G3 / G4 전체 PASS 권한 0건",
            "external_dependencies": "0 (stdlib re + json + dataclasses 단독, signed commit / branch protection / external timestamping 미진입)",
            "evidence_value": "Layer 1 inadequacy demo — chain-only mode 의도된 PASS → Layer 5 의무성 evidence (ADR-012 §2.8 답습)"
          }
          EOF
          cat group-c-followup-logs/summary.json

      - name: Upload history anchor verifier logs (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-anchor-verifier-evidence
          path: group-c-followup-logs/
          retention-days: 30

      - name: Evidence summary
        if: always()
        run: |
          {
            echo "## G4 History Rewrite — Layer 5 External Anchor Verifier — Evidence"
            echo "- commit: ${{ github.sha }}"
            echo "- ref: ${{ github.ref }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- event: g4_history_rewrite_layer5_anchor"
            echo "- agent: user"
            echo "- ledger_layer: Layer 5 — External anchor metadata (ADR-012 §2.8 답습)"
            echo "- list_attack: ${{ steps.list_attack.outputs.list_attack || 'FAIL' }} (5 attack + 11 fields + Layer 1 inadequacy demo)"
            echo "- anchor_pass_original: ${{ steps.anchor_pass_original.outputs.anchor_pass_original || 'FAIL' }}"
            echo "- anchor_pass_extended: ${{ steps.anchor_pass_extended.outputs.anchor_pass_extended || 'FAIL' }} (Layer 5 정상 운영 시제)"
            echo "- anchor_fail_rewrite: ${{ steps.anchor_fail_rewrite.outputs.anchor_fail_rewrite || 'FAIL' }}"
            echo "- anchor_fail_truncation: ${{ steps.anchor_fail_truncation.outputs.anchor_fail_truncation || 'FAIL' }}"
            echo "- anchor_fail_deletion: ${{ steps.anchor_fail_deletion.outputs.anchor_fail_deletion || 'FAIL' }}"
            echo "- anchor_fail_substitution: ${{ steps.anchor_fail_substitution.outputs.anchor_fail_substitution || 'FAIL' }}"
            echo "- anchor_fail_tampered: ${{ steps.anchor_fail_tampered.outputs.anchor_fail_tampered || 'FAIL' }} (known limitation: anchor signing 부재)"
            echo "- layer1_inadequacy_demo: ${{ steps.layer1_inadequacy.outputs.layer1_inadequacy || 'FAIL' }} (의도된 PASS — Layer 5 의무성 evidence)"
            echo "- forbidden_check: ${{ steps.forbidden_check.outputs.forbidden_check || 'FAIL' }} (실 signed commit / external service / GitHub API 0건)"
            echo "- f_forbidden_violations: 0/7"
            echo "- escalation_triggers: 0/5"
            echo "- external_dependencies: 0 (stdlib 단독, signed commit / external timestamping 미진입)"
            echo "- PASS scope: G4 *Layer 5 정적 검출 시제* 한정 (G4 / G2 / G3 / G4 전체 PASS 권한 0건, 사용자 명시 답습)"
            echo "- evidence_value: Layer 1 (Group C) 단독으로는 full rewrite/truncation/deletion/substitution 검출 불가 → Layer 5 anchor 의무성 (ADR-012 §2.8 답습)"
          } >> $GITHUB_STEP_SUMMARY
