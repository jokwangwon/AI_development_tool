# PC-1-T3 D-6 bypass detection CI 통합
#
# 답습 출처:
#   - docs/phase0/mvp1-pc1-d6-bypass-detection-ci-brief.md §4 (실 구현 1 항목)
#   - docs/review/3plus1-consensus-2026-05-27-mvp1-pc1-d6-bypass-detection-ci.md (Reviewer-only APPROVE)
#   - docs/phase0/mvp1-pc1-t3-mandatory-enforcement-brief.md §4.5 + D-6 carry-over
#   - docs/review/3plus1-consensus-2026-05-27-mvp1-1.5th-reinforcement-entry.md §6 R-6 BLOCKING
#
# 본 workflow 의 본질 (R-6 BLOCKING 흡수):
#   - 탐지 경로 (ii): pre-commit run --all-files CI 실행 = dev 환경 hook bypass 시 violation 검출
#   - (i) hook marker grep + (iii) setup audit log 는 .git/ 영역 local-only repo 외 → CI 직접 검증 불가,
#     단 (ii) 집계 검증으로 우회 시도 자동 검출 가능 (brief §2.1 답습)
#
# trigger 4종:
#   - push: 6 path filter (Python + YAML + Markdown + 본 workflow + audit 도구)
#   - pull_request: main + develop branch
#   - schedule: 매일 KST 12:00 (UTC 03:00) nightly (ST-2 동시간대 답습)
#   - workflow_dispatch: 수동 검증 자격
#
# job/context name = bypass-detect (현 7 contexts 중복 0)
# branch protection contexts 등록 = AR-3 admin scope, 사용자 영역 carry-over (b1-PC1-D6-contexts)
#
# Rollback Trigger:
#   - R-MVP1-1.5-PC1-1: 본 workflow FAIL = dev 환경 hook bypass 의심 → commit revert + PC-1-T3 강화 합의
#   - R-MVP1-PASS-9: 본 workflow 본문 변경 시 Provider Liquidity 영향 검증 의무 (provider-specific 의존 0)

name: PC-1-T3 bypass detection

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit-bypass-detection.yml"
      - "tools/pre_commit_install_audit.sh"
      - "**/*.py"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 3 * * *"  # 매일 KST 12:00 (UTC 03:00) nightly
  workflow_dispatch:

jobs:
  bypass-detect:
    name: bypass-detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit==4.0.1

      - name: Run pre-commit on all files (bypass detection)
        run: |
          # PC-1-T3 D-6 (ii): pre-commit run --all-files CI 실행
          # dev 환경 hook bypass 시 본 step 에서 violation 검출
          # FAIL 시 → R-MVP1-1.5-PC1-1 발화 자격
          pre-commit run --all-files --show-diff-on-failure
