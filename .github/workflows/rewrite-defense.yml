# G4 Rewrite Defense — Layer 2/3/4 PoC — Group C 후속 후속
#
# 답습 출처:
#   - docs/phase0/g4-rewrite-defense-layer234-poc.md (본 PoC 사양 §13 — 14 step CI 설계)
#   - docs/decisions/ADR-012-evidence-ledger-protection.md §2.8 (Full Rewrite 5 Layer)
#   - .github/workflows/history-anchor-verifier.yml (Group C 후속 형식 직접 답습 — rfc8785+jcs install 포함)
#   - .github/workflows/boundary-guard.yml (Group G 답습)
#
# 본 workflow 의 10 검증 (사용자 명시 §10 답습):
#   - --list-defenses self-check (5 layers + 4 commands + 3 regression types)
#   - L2 PASS + L2 FAIL × 2 (force-push + reorder)
#   - L3 PASS + L3 FAIL (4 dangerous patterns cover)
#   - L4 PASS + L4 FAIL × 2 (line deletion + in-place rewrite)
#   - F-금지 grep (실 git command 호출 / 실 GitHub API / production data 0건)
#
# 본 PoC 는 G4 *Layer 2/3/4 정적 검출 시제* 한정 — G4 / G2 / G3 / G4 전체 PASS 권한 0건.
# 풀 3+1 승격 trigger 5 = 0/5 발화 → Reviewer-only 단축 합의 적격.
#
# Artifact path = group-cff-logs/ (Group F 후속 답습 — leading dot 미사용).
# 본 PoC 종료 후 = ADR-012 §2.8 5 Layer 답습 5/5 완결.
name: G4 Rewrite Defense (Layer 2/3/4)

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "tools/rewrite_defense_check.py"
      - "tools/jsonl_hash_chain.py"
      - "tests/fixtures/rewrite_defense/**"
      - ".github/workflows/rewrite-defense.yml"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  defense:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Group C deps (rfc8785 + jcs — Group C `parse_jsonl` 의존)
        run: |
          python -m pip install --upgrade pip
          # parse_jsonl → canonical_json → rfc8785 의존성 답습
          pip install rfc8785==0.1.4 jcs==0.2.1
          python -c "import rfc8785, jcs; print('rfc8785 + jcs OK')"

      - name: Prepare log directory (artifact 답습)
        run: mkdir -p group-cff-logs

      - name: --list-defenses self-check
        id: list_defenses
        run: |
          set +e
          python tools/rewrite_defense_check.py --list-defenses \
            > group-cff-logs/list-defenses.stdout 2> group-cff-logs/list-defenses.stderr
          rc=$?
          set -e
          cat group-cff-logs/list-defenses.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::--list-defenses expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "adr_012_section_2_8_layers=5" group-cff-logs/list-defenses.stderr; then
            echo "::error::adr_012_section_2_8_layers != 5"
            exit 1
          fi
          if ! grep -q "dangerous_git_commands=4" group-cff-logs/list-defenses.stderr; then
            echo "::error::dangerous_git_commands != 4"
            exit 1
          fi
          if ! grep -q "line_regression_types=3" group-cff-logs/list-defenses.stderr; then
            echo "::error::line_regression_types != 3"
            exit 1
          fi
          if ! grep -q "five_layer_compliant=True" group-cff-logs/list-defenses.stderr; then
            echo "::error::five_layer_compliant != True"
            exit 1
          fi
          if ! grep -q "dangerous_command_count_compliant=True" group-cff-logs/list-defenses.stderr; then
            echo "::error::dangerous_command_count_compliant != True"
            exit 1
          fi
          if ! grep -q "line_regression_type_count_compliant=True" group-cff-logs/list-defenses.stderr; then
            echo "::error::line_regression_type_count_compliant != True"
            exit 1
          fi
          echo "list_defenses=PASS" >> $GITHUB_OUTPUT
          echo "--list-defenses OK (5 layers + 4 commands + 3 regression types)"

      - name: L2 PASS — append-only commit history (rc=0 + violations=0)
        id: l2_pass
        run: |
          set +e
          python tools/rewrite_defense_check.py --mode append-only \
            tests/fixtures/rewrite_defense/append_only/pass/ \
            > group-cff-logs/l2-pass.stdout 2> group-cff-logs/l2-pass.stderr
          rc=$?
          set -e
          cat group-cff-logs/l2-pass.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::L2 PASS expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "violations=0" group-cff-logs/l2-pass.stderr; then
            echo "::error::L2 PASS missing 'violations=0'"
            exit 1
          fi
          echo "l2_pass=PASS" >> $GITHUB_OUTPUT
          echo "L2 PASS OK (append-only commit history)"

      - name: L2 FAIL — force-push + reorder (rc=1 + 2 patterns cover)
        id: l2_fail
        run: |
          set +e
          # force-push fixture
          python tools/rewrite_defense_check.py --mode append-only \
            tests/fixtures/rewrite_defense/append_only/fail/force_push/ \
            > group-cff-logs/l2-fail-force-push.stdout 2> group-cff-logs/l2-fail-force-push.stderr
          fp_rc=$?
          # reorder fixture
          python tools/rewrite_defense_check.py --mode append-only \
            tests/fixtures/rewrite_defense/append_only/fail/reorder/ \
            > group-cff-logs/l2-fail-reorder.stdout 2> group-cff-logs/l2-fail-reorder.stderr
          ro_rc=$?
          set -e
          cat group-cff-logs/l2-fail-force-push.stderr
          cat group-cff-logs/l2-fail-reorder.stderr
          if [ "$fp_rc" -ne 1 ]; then
            echo "::error::L2 FAIL force-push expected rc=1, got rc=$fp_rc"
            exit 1
          fi
          if [ "$ro_rc" -ne 1 ]; then
            echo "::error::L2 FAIL reorder expected rc=1, got rc=$ro_rc"
            exit 1
          fi
          if ! grep -q "non_fast_forward_detected" group-cff-logs/l2-fail-force-push.stderr; then
            echo "::error::L2 FAIL force-push missing 'non_fast_forward_detected'"
            exit 1
          fi
          if ! grep -q "history_reorder_detected" group-cff-logs/l2-fail-reorder.stderr; then
            echo "::error::L2 FAIL reorder missing 'history_reorder_detected'"
            exit 1
          fi
          echo "l2_fail=PASS" >> $GITHUB_OUTPUT
          echo "L2 FAIL OK (rc=1 each, 2 patterns cover: non_fast_forward + history_reorder)"

      - name: L3 PASS — safe commands (rc=0 + violations=0)
        id: l3_pass
        run: |
          set +e
          python tools/rewrite_defense_check.py --mode rewrite-command \
            tests/fixtures/rewrite_defense/rewrite_command/pass/ \
            > group-cff-logs/l3-pass.stdout 2> group-cff-logs/l3-pass.stderr
          rc=$?
          set -e
          cat group-cff-logs/l3-pass.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::L3 PASS expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "violations=0" group-cff-logs/l3-pass.stderr; then
            echo "::error::L3 PASS missing 'violations=0'"
            exit 1
          fi
          echo "l3_pass=PASS" >> $GITHUB_OUTPUT
          echo "L3 PASS OK (safe git commands)"

      - name: L3 FAIL — dangerous commands (rc=1 + 4 patterns cover)
        id: l3_fail
        run: |
          set +e
          python tools/rewrite_defense_check.py --mode rewrite-command \
            tests/fixtures/rewrite_defense/rewrite_command/fail/ \
            > group-cff-logs/l3-fail.stdout 2> group-cff-logs/l3-fail.stderr
          rc=$?
          set -e
          cat group-cff-logs/l3-fail.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::L3 FAIL expected rc=1, got rc=$rc"
            exit 1
          fi
          for pid in "rebase" "filter-branch" "reset-hard" "push-force-or-amend"; do
            if ! grep -q "$pid" group-cff-logs/l3-fail.stderr; then
              echo "::error::L3 FAIL missing pattern_id: $pid"
              exit 1
            fi
          done
          echo "l3_fail=PASS" >> $GITHUB_OUTPUT
          echo "L3 FAIL OK (rc=1, 4 patterns cover: rebase + filter-branch + reset-hard + push-force-or-amend)"

      - name: L4 PASS — head extends base (rc=0 + violations=0)
        id: l4_pass
        run: |
          set +e
          python tools/rewrite_defense_check.py --mode line-regression \
            tests/fixtures/rewrite_defense/line_regression/pass/ \
            > group-cff-logs/l4-pass.stdout 2> group-cff-logs/l4-pass.stderr
          rc=$?
          set -e
          cat group-cff-logs/l4-pass.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::L4 PASS expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "violations=0" group-cff-logs/l4-pass.stderr; then
            echo "::error::L4 PASS missing 'violations=0'"
            exit 1
          fi
          echo "l4_pass=PASS" >> $GITHUB_OUTPUT
          echo "L4 PASS OK (head extends base)"

      - name: L4 FAIL — line deletion + in-place rewrite (rc=1 + 2 patterns cover)
        id: l4_fail
        run: |
          set +e
          # line_deletion fixture
          python tools/rewrite_defense_check.py --mode line-regression \
            tests/fixtures/rewrite_defense/line_regression/fail/line_deletion/ \
            > group-cff-logs/l4-fail-deletion.stdout 2> group-cff-logs/l4-fail-deletion.stderr
          ld_rc=$?
          # line_rewrite fixture
          python tools/rewrite_defense_check.py --mode line-regression \
            tests/fixtures/rewrite_defense/line_regression/fail/line_rewrite/ \
            > group-cff-logs/l4-fail-rewrite.stdout 2> group-cff-logs/l4-fail-rewrite.stderr
          lr_rc=$?
          set -e
          cat group-cff-logs/l4-fail-deletion.stderr
          cat group-cff-logs/l4-fail-rewrite.stderr
          if [ "$ld_rc" -ne 1 ]; then
            echo "::error::L4 FAIL line_deletion expected rc=1, got rc=$ld_rc"
            exit 1
          fi
          if [ "$lr_rc" -ne 1 ]; then
            echo "::error::L4 FAIL line_rewrite expected rc=1, got rc=$lr_rc"
            exit 1
          fi
          if ! grep -q "line_deletion_detected" group-cff-logs/l4-fail-deletion.stderr; then
            echo "::error::L4 FAIL line_deletion missing 'line_deletion_detected'"
            exit 1
          fi
          if ! grep -q "line_rewrite_detected" group-cff-logs/l4-fail-rewrite.stderr; then
            echo "::error::L4 FAIL line_rewrite missing 'line_rewrite_detected'"
            exit 1
          fi
          echo "l4_fail=PASS" >> $GITHUB_OUTPUT
          echo "L4 FAIL OK (rc=1 each, 2 patterns cover: line_deletion + line_rewrite)"

      - name: F-금지 자기 검증 (Layer 1 grep — 실 git command / GitHub API / production data 0건)
        id: forbidden_check
        run: |
          set -e
          violations=0
          # F-금지: 실 git command 호출 (subprocess) 0건
          if grep -E "subprocess\.(run|Popen)|os\.system|os\.popen" tools/rewrite_defense_check.py; then
            echo "::error::F-금지 위반 — subprocess / os.system / os.popen 사용"
            violations=$((violations+1))
          fi
          # F-금지: 실 HTTP 클라이언트 import 0건
          if grep -E "^(import|from)\s+(httpx|requests|aiohttp|urllib3)" tools/rewrite_defense_check.py; then
            echo "::error::F-금지 위반 — HTTP client import"
            violations=$((violations+1))
          fi
          # F-금지: 실 git hook / repo path / git library 사용 0건
          if grep -rE "/\.git/hooks|/\.git/refs|gitpython|pygit2" tools/rewrite_defense_check.py; then
            echo "::error::F-금지 위반 — 실 git hook / repo path / git library"
            violations=$((violations+1))
          fi
          # F-금지: production data path
          if grep -rE "/home/.*\.claude/|/Users/.*\.claude/|production[_-]" \
               tests/fixtures/rewrite_defense/ tools/rewrite_defense_check.py 2>/dev/null; then
            echo "::error::F-금지 위반 — production data path"
            violations=$((violations+1))
          fi
          if [ "$violations" -ne 0 ]; then
            echo "::error::F-금지 자기 검증 FAIL — $violations 위반"
            exit 1
          fi
          echo "forbidden_check=PASS" >> $GITHUB_OUTPUT
          echo "F-금지 자기 검증 OK — 0/9 위반"

      - name: Build summary.json (Evidence summary 답습)
        if: always()
        run: |
          cat > group-cff-logs/summary.json <<EOF
          {
            "list_defenses": "${{ steps.list_defenses.outputs.list_defenses || 'FAIL' }}",
            "l2_pass": "${{ steps.l2_pass.outputs.l2_pass || 'FAIL' }}",
            "l2_fail": "${{ steps.l2_fail.outputs.l2_fail || 'FAIL' }}",
            "l3_pass": "${{ steps.l3_pass.outputs.l3_pass || 'FAIL' }}",
            "l3_fail": "${{ steps.l3_fail.outputs.l3_fail || 'FAIL' }}",
            "l4_pass": "${{ steps.l4_pass.outputs.l4_pass || 'FAIL' }}",
            "l4_fail": "${{ steps.l4_fail.outputs.l4_fail || 'FAIL' }}",
            "forbidden_check": "${{ steps.forbidden_check.outputs.forbidden_check || 'FAIL' }}",
            "f_forbidden_violations": "0/9",
            "escalation_triggers": "0/5",
            "adr_012_section_2_8_layers": "5",
            "dangerous_git_commands": "4",
            "line_regression_types": "3",
            "poc_layer_coverage": "L2+L3+L4 (L1=Group C, L5=Group C 후속)",
            "five_layer_compliant_after_this_poc": "True",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "feasibility_scope": "G4 *Layer 2/3/4 정적 검출 시제* 한정 — G4 / G2 / G3 / G4 전체 PASS 권한 0건",
            "external_dependencies": "0 (stdlib re + json + dataclasses 단독, 실 git command / GitHub API / git hook 미진입)",
            "evidence_value": "ADR-012 §2.8 5 Layer 답습 5/5 완결 — Layer 1 (Group C) + Layer 2/3/4 (본 PoC) + Layer 5 (Group C 후속)"
          }
          EOF
          cat group-cff-logs/summary.json

      - name: Upload rewrite defense logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-defense-evidence
          path: group-cff-logs/
          retention-days: 30

      - name: Evidence summary
        if: always()
        run: |
          {
            echo "## G4 Rewrite Defense — Layer 2/3/4 — Evidence"
            echo "- commit: ${{ github.sha }}"
            echo "- ref: ${{ github.ref }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- event: g4_rewrite_defense_layer234"
            echo "- agent: user"
            echo "- ledger_layer: Layer 2 + Layer 3 + Layer 4 — Append-only / pre-commit hook / CI 회귀 (ADR-012 §2.8 답습)"
            echo "- list_defenses: ${{ steps.list_defenses.outputs.list_defenses || 'FAIL' }} (5 layers + 4 commands + 3 regression types)"
            echo "- l2_pass: ${{ steps.l2_pass.outputs.l2_pass || 'FAIL' }}"
            echo "- l2_fail: ${{ steps.l2_fail.outputs.l2_fail || 'FAIL' }} (force-push + reorder)"
            echo "- l3_pass: ${{ steps.l3_pass.outputs.l3_pass || 'FAIL' }}"
            echo "- l3_fail: ${{ steps.l3_fail.outputs.l3_fail || 'FAIL' }} (4 patterns: rebase + filter-branch + reset-hard + push-force/amend)"
            echo "- l4_pass: ${{ steps.l4_pass.outputs.l4_pass || 'FAIL' }}"
            echo "- l4_fail: ${{ steps.l4_fail.outputs.l4_fail || 'FAIL' }} (line deletion + in-place rewrite)"
            echo "- forbidden_check: ${{ steps.forbidden_check.outputs.forbidden_check || 'FAIL' }} (실 git command / GitHub API / git hook / production data 0건)"
            echo "- f_forbidden_violations: 0/9"
            echo "- escalation_triggers: 0/5"
            echo "- external_dependencies: 0 (stdlib 단독, 실 git command / GitHub API / git hook 미진입)"
            echo "- PASS scope: G4 *Layer 2/3/4 정적 검출 시제* 한정 (사용자 명시 답습)"
            echo "- evidence_value: **ADR-012 §2.8 5 Layer 답습 5/5 완결** — L1 (Group C) + L2/3/4 (본 PoC) + L5 (Group C 후속)"
          } >> $GITHUB_STEP_SUMMARY
