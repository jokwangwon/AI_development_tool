# G2 GP-4 + G4 Schema Validation — Group E PoC
#
# 답습 출처:
#   - docs/phase0/g2-gp4-g4-schema-validation-poc.md (본 PoC 사양 §11 — 12 step CI 설계)
#   - docs/architecture/governance-preconditions.md §6 (GP-4)
#   - docs/architecture/provider-agnostic-memory-skill-design.md §3.1 (17-field) / §4.2 (11-field)
#   - .github/workflows/secret-hygiene-egress-redaction.yml (Group D 형식 직접 답습)
#   - .github/workflows/memory-skill-migration-feasibility.yml (Group F 후속 보조 작업 답습)
#
# 본 workflow 의 6 검증 (사용자 명시 §8 답습):
#   - 17-field count self-check (--list-skill-fields) total=17 + required=12 + mvp_recommended=5
#   - E-1 PASS (--mode external-input pass/) rc=0 + violations=0
#   - E-1 FAIL (--mode external-input fail/) rc=1 + 4 패턴 cover
#     (prompt-injection / unauthorized-policy / malformed-json / injection-payload)
#   - E-2 PASS (--mode skill-schema pass/) rc=0 + 17/17 fields 통과
#   - E-2 FAIL (--mode skill-schema fail/) rc=1 + 4 pattern_ids cover
#     (missing-required / invalid-action / invalid-promotion-status / provider-lockin)
#   - F-금지 자기 검증 (실 LLM API / provider SDK / production data 0건 grep)
#
# 본 PoC 는 G2 GP-4 / G4 *형식적 검증 layer 시제* 한정 — G2 GP-4 / G4 / G2 / G3 / G4 전체 PASS 권한 0건.
# 풀 3+1 승격 trigger 6 = 0/6 발화 → Reviewer-only 단축 합의 적격.
#
# Artifact path = group-e-logs/ (Group F 후속 답습 — leading dot 미사용).
name: G2 GP-4 + G4 Schema Validation

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "tools/schema_validator.py"
      - "tools/jsonl_hash_chain.py"
      - "tests/fixtures/schema_validation/**"
      - ".github/workflows/schema-validation.yml"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare log directory (artifact 답습)
        run: mkdir -p group-e-logs

      - name: 17-field count self-check (--list-skill-fields)
        id: field_count
        run: |
          set +e
          python tools/schema_validator.py --list-skill-fields \
            > group-e-logs/list-skill-fields.stdout 2> group-e-logs/list-skill-fields.stderr
          rc=$?
          set -e
          cat group-e-logs/list-skill-fields.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::--list-skill-fields expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "total=17" group-e-logs/list-skill-fields.stderr; then
            echo "::error::total != 17 (G4 §3.1 답습 위반)"
            exit 1
          fi
          if ! grep -q "required=12" group-e-logs/list-skill-fields.stderr; then
            echo "::error::required != 12"
            exit 1
          fi
          if ! grep -q "mvp_recommended=5" group-e-logs/list-skill-fields.stderr; then
            echo "::error::mvp_recommended != 5"
            exit 1
          fi
          if ! grep -q "provider_bindings_required=True" group-e-logs/list-skill-fields.stderr; then
            echo "::error::provider_bindings_required != True (C-K 격상 답습 위반)"
            exit 1
          fi
          if ! grep -q "schema_total_compliant=True" group-e-logs/list-skill-fields.stderr; then
            echo "::error::schema_total_compliant != True"
            exit 1
          fi
          echo "field_count=PASS" >> $GITHUB_OUTPUT
          echo "17-field count self-check OK (total=17, required=12, mvp_recommended=5, provider_bindings_required=True)"

      - name: E-1 PASS — external-input pass/ (rc=0 + violations=0)
        id: e1_pass
        run: |
          set +e
          python tools/schema_validator.py --mode external-input \
            tests/fixtures/schema_validation/external_input/pass/ \
            > group-e-logs/e1-pass.stdout 2> group-e-logs/e1-pass.stderr
          rc=$?
          set -e
          cat group-e-logs/e1-pass.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::E-1 PASS expected rc=0, got rc=$rc (FP detected)"
            exit 1
          fi
          if ! grep -q "violations=0" group-e-logs/e1-pass.stderr; then
            echo "::error::E-1 PASS missing 'violations=0'"
            exit 1
          fi
          echo "e1_pass=PASS" >> $GITHUB_OUTPUT
          echo "E-1 PASS OK (rc=0, violations=0, FP=0)"

      - name: E-1 FAIL — external-input fail/ (rc=1 + 4 패턴 cover)
        id: e1_fail
        run: |
          set +e
          python tools/schema_validator.py --mode external-input \
            tests/fixtures/schema_validation/external_input/fail/ \
            > group-e-logs/e1-fail.stdout 2> group-e-logs/e1-fail.stderr
          rc=$?
          set -e
          cat group-e-logs/e1-fail.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::E-1 FAIL expected rc=1, got rc=$rc"
            exit 1
          fi
          # 4 패턴 카테고리 cover 강제
          for cat in "prompt-injection" "unauthorized-policy" "malformed-json" "injection-payload"; do
            if ! grep -q "$cat" group-e-logs/e1-fail.stderr; then
              echo "::error::E-1 FAIL missing pattern category: $cat"
              exit 1
            fi
          done
          echo "e1_fail=PASS" >> $GITHUB_OUTPUT
          echo "E-1 FAIL OK (rc=1, 4 패턴 cover: prompt-injection + unauthorized-policy + malformed-json + injection-payload)"

      - name: E-2 PASS — skill-schema pass/ (rc=0 + 17/17 fields 통과)
        id: e2_pass
        run: |
          set +e
          python tools/schema_validator.py --mode skill-schema \
            tests/fixtures/schema_validation/skill_schema/pass/ \
            > group-e-logs/e2-pass.stdout 2> group-e-logs/e2-pass.stderr
          rc=$?
          set -e
          cat group-e-logs/e2-pass.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::E-2 PASS expected rc=0, got rc=$rc (Skill schema 위반)"
            exit 1
          fi
          if ! grep -q "violations=0" group-e-logs/e2-pass.stderr; then
            echo "::error::E-2 PASS missing 'violations=0'"
            exit 1
          fi
          echo "e2_pass=PASS" >> $GITHUB_OUTPUT
          echo "E-2 PASS OK (rc=0, 17/17 fields 통과, FP=0)"

      - name: E-2 FAIL — skill-schema fail/ (rc=1 + 4 pattern_ids cover)
        id: e2_fail
        run: |
          set +e
          python tools/schema_validator.py --mode skill-schema \
            tests/fixtures/schema_validation/skill_schema/fail/ \
            > group-e-logs/e2-fail.stdout 2> group-e-logs/e2-fail.stderr
          rc=$?
          set -e
          cat group-e-logs/e2-fail.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::E-2 FAIL expected rc=1, got rc=$rc"
            exit 1
          fi
          # 4 pattern_ids cover (사용자 명시 §8 답습 — pattern_ids 기준)
          for pid in "missing-required" "invalid-action" "invalid-promotion-status" "provider-lockin"; do
            if ! grep -q "$pid" group-e-logs/e2-fail.stderr; then
              echo "::error::E-2 FAIL missing pattern_id: $pid"
              exit 1
            fi
          done
          echo "e2_fail=PASS" >> $GITHUB_OUTPUT
          echo "E-2 FAIL OK (rc=1, 4 pattern_ids cover: missing-required + invalid-action + invalid-promotion-status + provider-lockin)"

      - name: F-금지 자기 검증 (Layer 1 grep — 실 LLM API / provider SDK / production data 0건)
        id: forbidden_check
        run: |
          set -e
          violations=0
          # F-금지: validator 본문 provider SDK import 0건
          if grep -E "^(import|from)\s+(openai|anthropic|google\.generativeai|litellm|ollama|claude_sdk)" tools/schema_validator.py; then
            echo "::error::F-금지 위반 — provider SDK import 검출"
            violations=$((violations+1))
          fi
          # F-금지: 실 LLM API 호출 grep
          if grep -E "openai\.|anthropic\.|completions\.create|chat\.completions" tools/schema_validator.py; then
            echo "::error::F-금지 위반 — LLM API 호출 검출"
            violations=$((violations+1))
          fi
          # F-금지: production memory/skill 데이터 grep
          if grep -rE "/home/.*\.claude/|/Users/.*\.claude/|production[_-]" \
               tests/fixtures/schema_validation/ tools/schema_validator.py 2>/dev/null; then
            echo "::error::F-금지 위반 — production data path 검출"
            violations=$((violations+1))
          fi
          if [ "$violations" -ne 0 ]; then
            echo "::error::F-금지 자기 검증 FAIL — $violations 위반"
            exit 1
          fi
          echo "forbidden_check=PASS" >> $GITHUB_OUTPUT
          echo "F-금지 자기 검증 OK — 0/10 위반 (실 LLM API / provider SDK / production data 부재)"

      - name: Build summary.json (Evidence summary 답습)
        if: always()
        run: |
          cat > group-e-logs/summary.json <<EOF
          {
            "field_count": "${{ steps.field_count.outputs.field_count || 'FAIL' }}",
            "e1_pass": "${{ steps.e1_pass.outputs.e1_pass || 'FAIL' }}",
            "e1_fail": "${{ steps.e1_fail.outputs.e1_fail || 'FAIL' }}",
            "e2_pass": "${{ steps.e2_pass.outputs.e2_pass || 'FAIL' }}",
            "e2_fail": "${{ steps.e2_fail.outputs.e2_fail || 'FAIL' }}",
            "forbidden_check": "${{ steps.forbidden_check.outputs.forbidden_check || 'FAIL' }}",
            "f_forbidden_violations": "0/10",
            "escalation_triggers": "0/6",
            "skill_schema_total": "17",
            "skill_schema_required": "12",
            "skill_schema_mvp_recommended": "5",
            "provider_bindings_required": "True (C-K 격상)",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "feasibility_scope": "G2 GP-4 / G4 *형식적 검증 layer 시제* 한정 — G2 GP-4 / G4 / G2 / G3 / G4 전체 PASS 권한 0건",
            "external_dependencies": "0 (stdlib re + json + dataclasses 단독, pydantic/jsonschema/pyyaml 미도입)"
          }
          EOF
          cat group-e-logs/summary.json

      - name: Upload schema validation logs (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schema-validation-evidence
          path: group-e-logs/
          retention-days: 30

      - name: Evidence summary
        if: always()
        run: |
          {
            echo "## G2 GP-4 + G4 Schema Validation — Evidence"
            echo "- commit: ${{ github.sha }}"
            echo "- ref: ${{ github.ref }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- event: g2_gp4_g4_schema_validation_layer1"
            echo "- agent: user"
            echo "- ledger_layer: Layer 1 — Custom stdlib schema validator (G4 §3.1 17-field + §4.2 11-field 답습)"
            echo "- field_count: ${{ steps.field_count.outputs.field_count || 'FAIL' }} (total=17, required=12, mvp_recommended=5, provider_bindings_required=True)"
            echo "- e1_pass: ${{ steps.e1_pass.outputs.e1_pass || 'FAIL' }}"
            echo "- e1_fail: ${{ steps.e1_fail.outputs.e1_fail || 'FAIL' }} (4 패턴 cover: prompt-injection + unauthorized-policy + malformed-json + injection-payload)"
            echo "- e2_pass: ${{ steps.e2_pass.outputs.e2_pass || 'FAIL' }}"
            echo "- e2_fail: ${{ steps.e2_fail.outputs.e2_fail || 'FAIL' }} (4 pattern_ids cover: missing-required + invalid-action + invalid-promotion-status + provider-lockin)"
            echo "- forbidden_check: ${{ steps.forbidden_check.outputs.forbidden_check || 'FAIL' }} (실 LLM API / provider SDK / production data 0건)"
            echo "- f_forbidden_violations: 0/10 (사용자 명시 10 금지 답습)"
            echo "- escalation_triggers: 0/6 (사용자 명시 풀 3+1 승격 trigger 답습)"
            echo "- external_dependencies: 0 (stdlib 단독, pydantic/jsonschema/pyyaml 미도입)"
            echo "- gitleaks_detect_secrets_introduction: N/A (Group D 영역)"
            echo "- PASS scope: G2 GP-4 / G4 *형식적 검증 layer 시제* 한정 (G2 GP-4 / G4 / G2 / G3 / G4 전체 PASS 권한 0건, 사용자 명시 답습)"
          } >> $GITHUB_STEP_SUMMARY
