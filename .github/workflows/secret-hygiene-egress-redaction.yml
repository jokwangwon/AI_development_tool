# G2 GP-3 + GP-2 Credential/Secret Hygiene + Egress Redaction — Group D PoC
#
# 답습 출처:
#   - docs/phase0/g2-gp3-gp2-secret-hygiene-egress-redaction-poc.md (본 PoC 사양 §9 — 12 step CI 설계)
#   - docs/architecture/redaction-pattern-equivalence.md (R-4 — 패턴 동등성 카탈로그)
#   - docs/phase0/r4-1-trigger-extension-evidence.md §4.1 (R-4.1 — 45 patterns trigger 등록)
#   - .github/workflows/memory-skill-migration-feasibility.yml (Group F 형식 + 후속 보조 작업 답습)
#
# 본 workflow 의 6 검증 (사용자 명시 5.1 답습):
#   - D-1 PASS scan (scan-source pass/) rc=0 + violations=0
#   - D-1 FAIL scan (scan-source fail/) rc=1 + ≥4 + 4 패턴 cover (prefix / regex / alternation / private-key)
#   - D-2 PASS redaction residual (scan-log redaction_pass/) rc=0 + 0 잔존
#   - D-2 FAIL redaction leak (scan-log redaction_fail/) rc=1 + partial leak 검출 (base64 = known limitation)
#   - Tier-1 pattern count self-check (--list-patterns) registered_patterns_count=45 + tier1_42_catalog_compliant=True
#   - F-금지 자기 검증 (실 API key / provider SDK import 0건 grep)
#
# 본 PoC 는 G2 GP-2 / GP-3 *형식적 검출 layer 시제* 한정 — G2 GP-2 / GP-3 / G2 전체 Implementation/Runtime PASS 권한 0건.
# 풀 3+1 승격 trigger 7 = 0/7 발화 → Reviewer-only 단축 합의 적격.
#
# Artifact path = group-d-logs/ (Group F 후속 답습 — leading dot 미사용, hidden dir 정책 미의존).
name: G2 GP-3 + GP-2 Secret Hygiene & Egress Redaction

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "tools/secret_scanner.py"
      - "tools/docker_secret_image_layer_check.sh"
      - "tools/docker_secret_restart_recovery.sh"
      - "tools/mvp1_pc3_ar1_integration_check.py"
      - "tools/workflow_secrets_usage_check.py"
      - "tools/workflow_secrets_reference_check.py"
      - "tools/workflow_fork_pr_secret_policy_check.py"
      - "tests/fixtures/secret_hygiene/**"
      - "tests/fixtures/gp3_st3/**"
      - "tests/fixtures/mvp1_pc3_ar1_integration/**"
      - "tests/fixtures/stage5_g3_7/**"
      - "docker/gp3-st3-poc/**"
      - ".github/workflows/secret-hygiene-egress-redaction.yml"
      # Stage 4 (PC-3 + AR-1 통합 검증) 답습 — 양 GP workflow 변경 시 cross-workflow re-verify
      - ".github/workflows/provider-adapter-enforcement.yml"
      - ".github/workflows/provider-url-scanner.yml"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare log directory (artifact 답습)
        run: mkdir -p group-d-logs

      - name: Tier-1 pattern count self-check (--list-patterns)
        id: pattern_count
        run: |
          set +e
          python tools/secret_scanner.py --list-patterns \
            > group-d-logs/list-patterns.stdout 2> group-d-logs/list-patterns.stderr
          rc=$?
          set -e
          cat group-d-logs/list-patterns.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::--list-patterns expected rc=0, got rc=$rc"
            exit 1
          fi
          if ! grep -q "registered_patterns_count=45" group-d-logs/list-patterns.stderr; then
            echo "::error::registered_patterns_count != 45 (expected R-4.1 답습)"
            exit 1
          fi
          if ! grep -q "tier1_42_catalog_compliant=True" group-d-logs/list-patterns.stderr; then
            echo "::error::tier1_42_catalog_compliant != True (R-4.1 답습 위반)"
            exit 1
          fi
          echo "pattern_count=PASS" >> $GITHUB_OUTPUT
          echo "Tier-1 pattern count self-check OK (registered=45, compliant=True)"

      - name: D-1 PASS scan — scan-source pass/ (rc=0 + violations=0)
        id: d1_pass
        run: |
          set +e
          python tools/secret_scanner.py --mode scan-source \
            tests/fixtures/secret_hygiene/pass/ \
            > group-d-logs/d1-pass.stdout 2> group-d-logs/d1-pass.stderr
          rc=$?
          set -e
          cat group-d-logs/d1-pass.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::D-1 PASS expected rc=0, got rc=$rc (FP detected)"
            exit 1
          fi
          if ! grep -q "violations=0" group-d-logs/d1-pass.stderr; then
            echo "::error::D-1 PASS missing 'violations=0'"
            exit 1
          fi
          echo "d1_pass=PASS" >> $GITHUB_OUTPUT
          echo "D-1 PASS scan OK (rc=0, violations=0, FP=0)"

      - name: D-1 FAIL scan — scan-source fail/ (rc=1 + ≥4 + 4 패턴 cover)
        id: d1_fail
        run: |
          set +e
          python tools/secret_scanner.py --mode scan-source \
            tests/fixtures/secret_hygiene/fail/ \
            > group-d-logs/d1-fail.stdout 2> group-d-logs/d1-fail.stderr
          rc=$?
          set -e
          cat group-d-logs/d1-fail.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::D-1 FAIL expected rc=1, got rc=$rc"
            exit 1
          fi
          # ≥4 violations 강제
          violations=$(grep -oE "violations=[0-9]+" group-d-logs/d1-fail.stderr | head -1 | grep -oE "[0-9]+")
          if [ -z "$violations" ] || [ "$violations" -lt 4 ]; then
            echo "::error::D-1 FAIL expected violations>=4, got '$violations'"
            exit 1
          fi
          # 3 카테고리 cover (prefix-baseline + regex + alternation; private-key 는 regex sub-type T1-035)
          for cat in "prefix-baseline" "regex" "alternation"; do
            if ! grep -q "$cat" group-d-logs/d1-fail.stderr; then
              echo "::error::D-1 FAIL missing pattern category: $cat"
              exit 1
            fi
          done
          # private-key sub-type 검증 (T1-035 ID grep)
          if ! grep -q "T1-035" group-d-logs/d1-fail.stderr; then
            echo "::error::D-1 FAIL missing private-key sub-type (T1-035)"
            exit 1
          fi
          echo "d1_fail=PASS" >> $GITHUB_OUTPUT
          echo "D-1 FAIL scan OK (rc=1, violations=$violations, 4 패턴 cover incl. private-key T1-035)"

      - name: D-2 PASS redaction residual — scan-log redaction_pass/ (rc=0 + 0 잔존)
        id: d2_pass
        run: |
          set +e
          python tools/secret_scanner.py --mode scan-log \
            tests/fixtures/secret_hygiene/redaction_pass/ \
            > group-d-logs/d2-pass.stdout 2> group-d-logs/d2-pass.stderr
          rc=$?
          set -e
          cat group-d-logs/d2-pass.stderr
          if [ "$rc" -ne 0 ]; then
            echo "::error::D-2 PASS expected rc=0 (redaction marker 인식 OK), got rc=$rc"
            exit 1
          fi
          if ! grep -q "violations=0" group-d-logs/d2-pass.stderr; then
            echo "::error::D-2 PASS missing 'violations=0'"
            exit 1
          fi
          echo "d2_pass=PASS" >> $GITHUB_OUTPUT
          echo "D-2 PASS redaction residual OK (rc=0, 잔존=0, [REDACTED] 마커 인식)"

      - name: D-2 FAIL redaction leak — scan-log redaction_fail/ (rc=1 + partial leak 검출)
        id: d2_fail
        run: |
          set +e
          python tools/secret_scanner.py --mode scan-log \
            tests/fixtures/secret_hygiene/redaction_fail/ \
            > group-d-logs/d2-fail.stdout 2> group-d-logs/d2-fail.stderr
          rc=$?
          set -e
          cat group-d-logs/d2-fail.stderr
          if [ "$rc" -ne 1 ]; then
            echo "::error::D-2 FAIL expected rc=1 (partial leak 검출), got rc=$rc"
            exit 1
          fi
          # partial_redact.txt leak 검출 강제
          if ! grep -q "partial_redact.txt" group-d-logs/d2-fail.stderr; then
            echo "::error::D-2 FAIL missing partial_redact.txt leak detection"
            exit 1
          fi
          # base64_evasion.txt 미검출 = 의도된 known limitation (PoC 사양 §8 #1 답습)
          if grep -q "base64_evasion.txt" group-d-logs/d2-fail.stderr; then
            echo "::warning::base64_evasion.txt 가 검출됨 — known limitation 영역 변경 가능성 (사양 §8 #1 검토 필요)"
          else
            echo "base64 evasion = known limitation 답습 (Hermes upstream R2-6 영역, 본 PoC 미검출 의도)"
          fi
          echo "d2_fail=PASS" >> $GITHUB_OUTPUT
          echo "D-2 FAIL redaction leak OK (rc=1, partial_redact 검출, base64 미검출 = known limitation)"

      - name: F-금지 자기 검증 (Layer 1 grep — 실 API key / provider SDK 0건)
        id: forbidden_check
        run: |
          set -e
          # F-금지 #1: 실 API key 0건 (fake canary 의무 — 모든 secret 은 FAKE / NOTAREAL / fakecanary marker 포함)
          # 검사 대상 = fixture + scanner. scanner regex catalog 자체는 정의이므로 *fake marker 없는 raw secret*
          # 형식이 fixture / scanner 외 위치에 존재 시 위반.
          violations=0
          for f in tests/fixtures/secret_hygiene/pass/*.py \
                   tests/fixtures/secret_hygiene/pass/*.json \
                   tests/fixtures/secret_hygiene/fail/*.py \
                   tests/fixtures/secret_hygiene/fail/*.json \
                   tests/fixtures/secret_hygiene/fail/*.pem \
                   tests/fixtures/secret_hygiene/redaction_pass/*.txt \
                   tests/fixtures/secret_hygiene/redaction_fail/*.txt; do
            [ -f "$f" ] || continue
            # sk- / sk-ant- / ghp_ / AKIA / xoxb- 등 prefix 가 fake marker 없이 출현하면 위반
            if grep -P 'sk-(?!FAKE|ant-FAKE|ant-)' "$f" 2>/dev/null \
               | grep -v "FAKE\|NOTAREAL\|fakecanary\|R41T\|REDACTED\|FAK\[" \
               | grep -P 'sk-[A-Za-z0-9_-]{10}' >/dev/null; then
              echo "::error::F-금지 #1 위반 — fake marker 없는 sk- prefix in $f"
              violations=$((violations+1))
            fi
            if grep -P 'AKIA(?!FAKE)' "$f" 2>/dev/null \
               | grep -v "FAKE\|NOTAREAL\|R41T\|REDACTED" \
               | grep -P 'AKIA[A-Z0-9]{16}' >/dev/null; then
              echo "::error::F-금지 #1 위반 — fake marker 없는 AKIA prefix in $f"
              violations=$((violations+1))
            fi
            if grep -P 'ghp_(?!FAKE)' "$f" 2>/dev/null \
               | grep -v "FAKE\|NOTAREAL\|R41T\|REDACTED" \
               | grep -P 'ghp_[A-Za-z0-9]{10}' >/dev/null; then
              echo "::error::F-금지 #1 위반 — fake marker 없는 ghp_ prefix in $f"
              violations=$((violations+1))
            fi
          done
          # F-금지 #2: scanner 본문 provider SDK import 0건
          if grep -E "^(import|from)\s+(openai|anthropic|google\.generativeai|litellm|ollama)" tools/secret_scanner.py; then
            echo "::error::F-금지 #2 위반 — provider SDK import 검출"
            violations=$((violations+1))
          fi
          if [ "$violations" -ne 0 ]; then
            echo "::error::F-금지 자기 검증 FAIL — $violations 위반"
            exit 1
          fi
          echo "forbidden_check=PASS" >> $GITHUB_OUTPUT
          echo "F-금지 자기 검증 OK — 0/12 위반 (fake canary 의무 답습 + provider SDK 0건)"

      - name: MVP-1 entry — secret_scanner coverage check (mvp1_entry/ fixtures)
        id: mvp1_entry_scan
        run: |
          set +e
          # MVP-1 entry fail scan — expect rc=1 + cover H-C/H-F/H-G/H-K + Tier-1 prefix variety
          python tools/secret_scanner.py --mode scan-source \
            tests/fixtures/secret_hygiene/mvp1_entry/fail/ \
            > group-d-logs/mvp1-entry-fail.stdout 2> group-d-logs/mvp1-entry-fail.stderr
          rc_fail=$?
          # MVP-1 entry pass scan — expect rc=0 (FP-resistance for lookalike identifiers)
          python tools/secret_scanner.py --mode scan-source \
            tests/fixtures/secret_hygiene/mvp1_entry/pass/ \
            > group-d-logs/mvp1-entry-pass.stdout 2> group-d-logs/mvp1-entry-pass.stderr
          rc_pass=$?
          set -e
          cat group-d-logs/mvp1-entry-fail.stderr
          cat group-d-logs/mvp1-entry-pass.stderr
          if [ "$rc_fail" -ne 1 ]; then
            echo "::error::MVP-1 entry fail scan expected rc=1, got rc=$rc_fail"
            exit 1
          fi
          if [ "$rc_pass" -ne 0 ]; then
            echo "::error::MVP-1 entry pass scan expected rc=0, got rc=$rc_pass (FP detected)"
            exit 1
          fi
          # Verify additional Tier-1 pattern IDs cover (regex H-C/H-F/H-G/H-K + prefix variety)
          for pid in "T1-002" "T1-006" "T1-016" "T1-019" "T1-024" "T1-026" "T1-034" "T1-036" "T1-037" "T1-039"; do
            if ! grep -q "$pid" group-d-logs/mvp1-entry-fail.stderr; then
              echo "::error::MVP-1 entry fail scan missing pattern ID: $pid"
              exit 1
            fi
          done
          echo "mvp1_entry_scan=PASS" >> $GITHUB_OUTPUT
          # Ledger entry candidate (사용자 명시 답습 — Backlog #5 별도 합의 영역, 본 step = 후보 한정)
          echo "ledger_event_candidate=secret_scan_layer1_implementation" >> $GITHUB_OUTPUT
          echo "MVP-1 entry scan OK — fail rc=1 + 10 Tier-1 IDs cover, pass rc=0"

      - name: Stage 2 (ST-3) image layer leak check (gp3_st3 fixtures)
        id: stage2_image_layer
        run: |
          set -e
          # FAIL fixture — expect leak (canary baked via COPY)
          tools/docker_secret_image_layer_check.sh \
            tests/fixtures/gp3_st3/fail \
            'FAKE_TEST_SECRET_DO_NOT_USE_gp3_stage2_layer_leak_canary_2026' \
            leak \
            | tee group-d-logs/stage2-image-layer-fail.log
          # PASS fixture — expect clean (no secret baked)
          tools/docker_secret_image_layer_check.sh \
            tests/fixtures/gp3_st3/pass \
            'FAKE_TEST_SECRET_DO_NOT_USE_gp3_stage2_layer_leak_canary_2026' \
            clean \
            | tee group-d-logs/stage2-image-layer-pass.log
          echo "stage2_image_layer=PASS" >> $GITHUB_OUTPUT
          echo "Stage 2 image layer check OK — fail fixture leak detected, pass fixture clean"

      - name: Stage 2 (ST-3) container restart recovery check (gp3-st3-poc compose)
        id: stage2_restart_recovery
        run: |
          set -e
          tools/docker_secret_restart_recovery.sh docker/gp3-st3-poc \
            | tee group-d-logs/stage2-restart-recovery.log
          echo "stage2_restart_recovery=PASS" >> $GITHUB_OUTPUT
          # Stage 2 ledger entry candidate (사용자 명시 답습 — Backlog #5 별도 합의 영역, 본 step = 후보 한정)
          echo "stage2_ledger_event_candidate=docker_secret_isolation_layer1_implementation" >> $GITHUB_OUTPUT
          echo "Stage 2 restart recovery OK — secret sha256 일치 + isolation_check=PASS (2회)"

      - name: Stage 4 (PC-3 + AR-1) integration check — 3 workflow cross-verify
        id: stage4_pc3_ar1_integration
        run: |
          set -e
          # 3 real workflow 정적 통합 검증 (rc=0 기대)
          python3 tools/mvp1_pc3_ar1_integration_check.py --mode integration \
            .github/workflows/secret-hygiene-egress-redaction.yml \
            .github/workflows/provider-adapter-enforcement.yml \
            .github/workflows/provider-url-scanner.yml \
            | tee group-d-logs/stage4-pc3-ar1-integration.log
          # PASS fixture (rc=0 기대)
          python3 tools/mvp1_pc3_ar1_integration_check.py --mode integration \
            tests/fixtures/mvp1_pc3_ar1_integration/pass/compliant_entry_step.yml \
            | tee group-d-logs/stage4-pc3-ar1-fixture-pass.log
          # FAIL fixture — PC-3 violation (rc=1 기대)
          set +e
          python3 tools/mvp1_pc3_ar1_integration_check.py --mode integration \
            tests/fixtures/mvp1_pc3_ar1_integration/fail/pc3_violation_continue_on_error.yml \
            > group-d-logs/stage4-pc3-ar1-fixture-pc3-fail.log
          rc_pc3=$?
          # FAIL fixture — AR-1 violation (rc=1 기대)
          python3 tools/mvp1_pc3_ar1_integration_check.py --mode integration \
            tests/fixtures/mvp1_pc3_ar1_integration/fail/ar1_violation_no_fail_closed.yml \
            > group-d-logs/stage4-pc3-ar1-fixture-ar1-fail.log
          rc_ar1=$?
          set -e
          cat group-d-logs/stage4-pc3-ar1-fixture-pc3-fail.log
          cat group-d-logs/stage4-pc3-ar1-fixture-ar1-fail.log
          if [ "$rc_pc3" -ne 1 ]; then
            echo "::error::PC-3 violation fixture expected rc=1, got rc=$rc_pc3 — Stage 4 verifier 무력화 가능"
            exit 1
          fi
          if [ "$rc_ar1" -ne 1 ]; then
            echo "::error::AR-1 violation fixture expected rc=1, got rc=$rc_ar1 — Stage 4 verifier 무력화 가능"
            exit 1
          fi
          # Stage 4 self-check (--list-checks)
          python3 tools/mvp1_pc3_ar1_integration_check.py --list-checks \
            | tee group-d-logs/stage4-pc3-ar1-list-checks.log
          echo "stage4_pc3_ar1_integration=PASS" >> $GITHUB_OUTPUT
          # Stage 4 ledger entry candidate (사용자 명시 답습 — Backlog #5 별도 합의 영역, 본 step = 후보 한정)
          echo "stage4_ledger_event_candidate=pc3_ar1_integration_implementation" >> $GITHUB_OUTPUT
          echo "Stage 4 PC-3 + AR-1 integration OK — 3 workflows 5 entry steps PASS + 3 fixtures 양방향 검증"

      - name: Stage 5 cycle 1 — workflow secrets usage 0건 검증 (5.1)
        id: stage5_5_1_secrets_usage
        run: |
          set -e
          # 1) Real .github/workflows/ 전체 — 0건 baseline 검증 (rc=0 기대)
          python3 tools/workflow_secrets_usage_check.py .github/workflows/ \
            | tee group-d-logs/stage5-5.1-secrets-usage-real.log
          # 2) PASS fixture (rc=0 기대)
          python3 tools/workflow_secrets_usage_check.py \
            tests/fixtures/stage5_g3_7/secrets_usage/pass/ \
            | tee group-d-logs/stage5-5.1-secrets-usage-fixture-pass.log
          # 3) FAIL fixture (rc=1 기대 + ≥2 violations: interpolation + block)
          set +e
          python3 tools/workflow_secrets_usage_check.py \
            tests/fixtures/stage5_g3_7/secrets_usage/fail/ \
            > group-d-logs/stage5-5.1-secrets-usage-fixture-fail.log
          rc_fail=$?
          set -e
          cat group-d-logs/stage5-5.1-secrets-usage-fixture-fail.log
          if [ "$rc_fail" -ne 1 ]; then
            echo "::error::Cycle 1 FAIL fixture expected rc=1, got rc=$rc_fail — verifier 무력화 가능"
            exit 1
          fi
          violations=$(grep -oE "violations = [0-9]+" group-d-logs/stage5-5.1-secrets-usage-fixture-fail.log | head -1 | grep -oE "[0-9]+")
          if [ -z "$violations" ] || [ "$violations" -lt 2 ]; then
            echo "::error::Cycle 1 FAIL fixture expected violations>=2, got '$violations'"
            exit 1
          fi
          # interpolation + block 두 kind 모두 cover 검증
          if ! grep -q "kind=interpolation" group-d-logs/stage5-5.1-secrets-usage-fixture-fail.log; then
            echo "::error::Cycle 1 FAIL fixture missing kind=interpolation"
            exit 1
          fi
          if ! grep -q "kind=block" group-d-logs/stage5-5.1-secrets-usage-fixture-fail.log; then
            echo "::error::Cycle 1 FAIL fixture missing kind=block"
            exit 1
          fi
          # self-check
          python3 tools/workflow_secrets_usage_check.py --list-checks \
            | tee group-d-logs/stage5-5.1-secrets-usage-list-checks.log
          echo "stage5_5_1_secrets_usage=PASS" >> $GITHUB_OUTPUT
          # Stage 5 ledger entry candidate (사용자 명시 답습 — Backlog #5 별도 합의 영역, 본 step = 후보 한정)
          echo "stage5_ledger_event_candidate=g3_7_workflow_hygiene_implementation" >> $GITHUB_OUTPUT
          echo "Stage 5 cycle 1 OK — real workflows violations=0 + PASS fixture violations=0 + FAIL fixture violations=$violations (interpolation + block cover)"

      - name: Stage 5 cycle 2 — workflow secrets.* 참조 감지 (5.2)
        id: stage5_5_2_secrets_dot_ref
        run: |
          set -e
          # 1) Real .github/workflows/ 전체 — 0건 baseline 검증 (rc=0 기대)
          python3 tools/workflow_secrets_reference_check.py .github/workflows/ \
            | tee group-d-logs/stage5-5.2-secrets-ref-real.log
          # 2) PASS fixture (rc=0 기대)
          python3 tools/workflow_secrets_reference_check.py \
            tests/fixtures/stage5_g3_7/secrets_reference/pass/ \
            | tee group-d-logs/stage5-5.2-secrets-ref-fixture-pass.log
          # 3) FAIL fixture (rc=1 기대 + ≥4 violations + 4 context cover)
          set +e
          python3 tools/workflow_secrets_reference_check.py \
            tests/fixtures/stage5_g3_7/secrets_reference/fail/ \
            > group-d-logs/stage5-5.2-secrets-ref-fixture-fail.log
          rc_fail=$?
          set -e
          cat group-d-logs/stage5-5.2-secrets-ref-fixture-fail.log
          if [ "$rc_fail" -ne 1 ]; then
            echo "::error::Cycle 2 FAIL fixture expected rc=1, got rc=$rc_fail — verifier 무력화 가능"
            exit 1
          fi
          violations=$(grep -oE "violations = [0-9]+" group-d-logs/stage5-5.2-secrets-ref-fixture-fail.log | head -1 | grep -oE "[0-9]+")
          if [ -z "$violations" ] || [ "$violations" -lt 4 ]; then
            echo "::error::Cycle 2 FAIL fixture expected violations>=4, got '$violations'"
            exit 1
          fi
          # 4 context cover 검증 (env / with / run / if 모두 present)
          for ctx in "context\[env\]" "context\[with\]" "context\[run\]" "context\[if\]"; do
            if ! grep -qE "$ctx" group-d-logs/stage5-5.2-secrets-ref-fixture-fail.log; then
              echo "::error::Cycle 2 FAIL fixture missing context: $ctx"
              exit 1
            fi
          done
          # self-check
          python3 tools/workflow_secrets_reference_check.py --list-checks \
            | tee group-d-logs/stage5-5.2-secrets-ref-list-checks.log
          echo "stage5_5_2_secrets_dot_ref=PASS" >> $GITHUB_OUTPUT
          echo "Stage 5 cycle 2 OK — real workflows violations=0 + PASS fixture violations=0 + FAIL fixture violations=$violations (env+with+run+if cover)"

      - name: Stage 5 cycle 3 — fork PR secret 정책 검증 (5.3)
        id: stage5_5_3_fork_pr_policy
        run: |
          set -e
          # 1) Real .github/workflows/ 전체 — 위험 trigger 0건 baseline 검증 (rc=0 기대)
          python3 tools/workflow_fork_pr_secret_policy_check.py .github/workflows/ \
            | tee group-d-logs/stage5-5.3-fork-pr-policy-real.log
          # 2) PASS fixture (rc=0 기대)
