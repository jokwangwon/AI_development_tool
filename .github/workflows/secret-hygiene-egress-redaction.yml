            tests/fixtures/stage5_g3_7/fork_pr_policy/pass/ \
            | tee group-d-logs/stage5-5.3-fork-pr-policy-fixture-pass.log
          # 3) FAIL fixture (rc=1 기대 + ≥2 violations + HIGH + MEDIUM 양방향)
