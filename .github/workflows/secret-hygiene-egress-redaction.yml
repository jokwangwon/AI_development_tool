          set -e
          cat group-d-logs/stage5-5.3-fork-pr-policy-fixture-fail.log
          if [ "$rc_fail" -ne 1 ]; then
            echo "::error::Cycle 3 FAIL fixture expected rc=1, got rc=$rc_fail — verifier 무력화 가능"
            exit 1
          fi
          violations=$(grep -oE "violations = [0-9]+" group-d-logs/stage5-5.3-fork-pr-policy-fixture-fail.log | head -1 | grep -oE "[0-9]+")
          if [ -z "$violations" ] || [ "$violations" -lt 2 ]; then
            echo "::error::Cycle 3 FAIL fixture expected violations>=2, got '$violations'"
            exit 1
          fi
          # HIGH (pull_request_target) + MEDIUM (workflow_run) 양방향 cover 검증
          if ! grep -q "trigger=pull_request_target" group-d-logs/stage5-5.3-fork-pr-policy-fixture-fail.log; then
            echo "::error::Cycle 3 FAIL fixture missing trigger=pull_request_target (HIGH)"
            exit 1
          fi
          if ! grep -q "trigger=workflow_run" group-d-logs/stage5-5.3-fork-pr-policy-fixture-fail.log; then
