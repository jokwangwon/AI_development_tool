            "stage2_ledger_event_registration": "candidate-only (Backlog #5 분리 — ADR-012 §2.2 enum 정식 등록 별도 합의)",
            "stage2_evidence_form": "Markdown step summary + JSONL stub (stage2-image-layer-fail.log, stage2-image-layer-pass.log, stage2-restart-recovery.log) + actual run URL — Layer C 발효 시점 의무",
            "stage2_scope": "GP-3 Stage 2 (ST-3 docker secret) 단독 구현 진입 — Hermes upstream 변경 0건 + production docker-compose 변경 0건 + Implementation Evidence PASS / MVP-1 PASS / Operational Readiness / Hermes PMO 격상 0건",
