          # self-check
          python3 tools/workflow_fork_pr_secret_policy_check.py --list-checks \
            | tee group-d-logs/stage5-5.3-fork-pr-policy-list-checks.log
          echo "stage5_5_3_fork_pr_policy=PASS" >> $GITHUB_OUTPUT
          echo "Stage 5 cycle 3 OK — real workflows violations=0 + PASS fixture violations=0 + FAIL fixture violations=$violations (HIGH + MEDIUM cover)"

