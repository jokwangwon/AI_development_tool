# GP-3 Stage 2 ST-3 PoC — docker secret 단독 (저장 경로 isolation)
#
# 답습:
#   - ADR-008 §2.6.2 R2-1 (file system secret isolation via docker secret)
#   - implementation-runtime-roadmap-mvp1.md §3.4.2 docker_secret_isolation_check + container_restart_recovery
#   - implementation-runtime-roadmap-mvp1.md §5.3 (ST-3 = MVP-1 1차 docker secret 단독, Hermes upstream 변경 회피)
#
# 본 compose 는 PoC 격리 영역 (docker/gp3-st3-poc/) 한정 — production docker-compose 변경 0건.
# secret material = secrets/api_key.placeholder (FAKE_TEST_SECRET marker — F-금지 답습).

services:
  gp3-st3-poc:
    build:
      context: .
      dockerfile: Dockerfile
    image: gp3-st3-poc:local
    container_name: gp3-st3-poc
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    secrets:
      - source: api_key
        target: api_key
        mode: 0400

secrets:
  api_key:
    file: ./secrets/api_key.placeholder
