# Stage 5 Cycle 2 fixture — FAIL expected (secrets references in 4 contexts)
#
# 본 fixture = 4 context 별 secrets.* 참조 cover (env / with / run / if).
#   - env: FAKE_TOKEN: ${{ secrets.FAKE_ENV_TOKEN }}
#   - with: token: ${{ secrets.FAKE_WITH_TOKEN }}
#   - run: shell 내 ${{ secrets.FAKE_RUN_TOKEN }}
#   - if: bare ``secrets.FAKE_IF_TOKEN != ''`` (no ${{ }} wrapping)
#   - secret name 은 FAKE marker 한정 (실 secret 0건)
# → tools/workflow_secrets_reference_check.py rc=1, violations>=4 + 4 context cover
#
# 본 fixture 는 실 workflow 가 아니며 — 정적 verifier negative case 데이터.

name: Fixture — secrets references in 4 contexts (FAIL)

on:
  push:
    branches:
      - "fixture-only/**"

permissions:
  contents: read

jobs:
  fail_ref:
    runs-on: ubuntu-latest
    if: ${{ secrets.FAKE_IF_TOKEN != '' }}
    env:
      FAKE_ENV_TOKEN: ${{ secrets.FAKE_ENV_TOKEN }}
    steps:
      - name: Checkout with secret input (with context)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FAKE_WITH_TOKEN }}

      - name: Sample run step using secret (run context)
        run: |
          set -e
          # 위반: run block 내 secrets.* interpolation (shell expansion before runtime)
          echo "secret_len=${#FAKE}"
          echo "direct=${{ secrets.FAKE_RUN_TOKEN }}"
